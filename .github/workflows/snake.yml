name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # chạy mỗi ngày lúc 00:00 UTC
  workflow_dispatch:      # cho phép bấm chạy tay
  push:
    branches:
      - main              # đúng với branch của bạn

# CHÚ Ý: phần permissions này rất quan trọng để action được phép push lên branch output
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: khanh-clumsy
          outputs: |
            dist/snake.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
